
<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clicker Game</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Clicker Game</h1>

    <h2>Poäng: <span id="score">0</span></h2>

    <p>Poäng per klick: <span id="power">1</span></p>

    <button id="clickButton">KLICKA HÄR!</button>

    <br><br>

    <button id="upgradeButton">
        Uppgradera
    </button>

    <p>
        Kostnad: <span id="cost">10</span> poäng
    </p>

    <br>

    <button id="resetButton">
        Återställ
    </button>

    <script src="script.js"></script>

</body>
